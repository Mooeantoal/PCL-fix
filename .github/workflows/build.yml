name: Build PCL 2.100

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK (for C# 13 in MeloongCore)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # CurseForge API Key 通过环境变量传入；构建时注入 ModSecret.vb 的默认值，
      # 使打出的 exe 自带 Key（仓库源码仍保持空串，运行时环境变量仍可覆盖），不再生成明文 sidecar 文件
      - name: Inject CurseForge API Key
        shell: pwsh
        env:
          CF_KEY: ${{ secrets.PCL_CURSEFORGE_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $key = $env:CF_KEY
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Output "::warning::未配置 Secret PCL_CURSEFORGE_API_KEY，CurseForge 模组搜索将不可用。"
          } else {
            $file = "Plain Craft Launcher 2/Modules/ModSecret.vb"
            $c = [System.IO.File]::ReadAllText($file)
            $c = $c -replace 'If\(Environment\.GetEnvironmentVariable\("PCL_CURSEFORGE_API_KEY"\), ""\)', "If(Environment.GetEnvironmentVariable(`"PCL_CURSEFORGE_API_KEY`"), `"$($key.Trim())`")"
            [System.IO.File]::WriteAllText($file, $c, (New-Object System.Text.UTF8Encoding($false)))
            Write-Output "CurseForge API Key 已注入 ModSecret.vb（不打印内容）"
          }

      # 微软登录 ClientId：仓库源码默认值已改为 Minecraft 官方公开客户端 ID（可直接登录）。
      # 若配置了 Secret PCL_MS_CLIENT_ID，则构建时覆盖该默认值（需为“公共客户端”应用，否则设备码流程报 70002）。
      - name: Inject MS Client ID
        shell: pwsh
        env:
          MS_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $id = $env:MS_ID
          if ([string]::IsNullOrWhiteSpace($id)) {
            Write-Output "::notice::未配置 Secret PCL_MS_CLIENT_ID，将使用内置的 Minecraft 公开客户端 ID（仍可正常登录）。"
          } else {
            $file = "Plain Craft Launcher 2/Modules/ModSecret.vb"
            $c = [System.IO.File]::ReadAllText($file)
            $c = $c -replace 'If\(Environment\.GetEnvironmentVariable\("PCL_MS_CLIENT_ID"\), "00000000-0000-0000-0000-000000000000"\)', "If(Environment.GetEnvironmentVariable(`"PCL_MS_CLIENT_ID`"), `"$($id.Trim())`")"
            [System.IO.File]::WriteAllText($file, $c, (New-Object System.Text.UTF8Encoding($false)))
            Write-Output "MS Client ID 已注入 ModSecret.vb（不打印内容）"
          }

      - name: Restore NuGet packages
        run: msbuild "Plain Craft Launcher 2.sln" -t:Restore -p:Configuration=Release -p:RestorePackagesConfig=true -nologo -v:m

      - name: Build
        run: msbuild "Plain Craft Launcher 2.sln" -p:Configuration=Release -m -nologo -v:m

      - name: Collect runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "Plain Craft Launcher 2/bin/"
          Copy-Item "Plain Craft Launcher 2/Resources/*.dll" $out -Force
          Copy-Item "Plain Craft Launcher 2/Resources/*.jar" $out -Force
          Copy-Item "PCLCS/Launch/*.jar" $out -Force
          Write-Output "runtime files copied"

      - name: Verify artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exes = Get-ChildItem "Plain Craft Launcher 2/bin/*.exe" -ErrorAction SilentlyContinue
          if ($exes.Count -eq 0) {
            Write-Output "::error::产物中缺少 exe，构建可能失败"
            exit 1
          }
          Write-Output "产物校验通过：$($exes.Count) 个 exe 已生成"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-2.100.0.0
          path: "Plain Craft Launcher 2/bin/"
          if-no-files-found: error
