name: Build PCL 2.99

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK (for C# 13 in MeloongCore)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set CurseForge API Key
        run: |
          "${{ secrets.PCL_CURSEFORGE_API_KEY }}" | Out-File -FilePath "Plain Craft Launcher 2/Resources/cf_api_key.txt" -Encoding utf8

      - name: Restore NuGet packages
        run: msbuild "Plain Craft Launcher 2.sln" -t:Restore -p:Configuration=Release -p:RestorePackagesConfig=true -nologo -v:m

      - name: Build
        run: msbuild "Plain Craft Launcher 2.sln" -p:Configuration=Release -m -nologo -v:m

      - name: Collect runtime files
        run: |
          $out = "Plain Craft Launcher 2/bin/"
          Copy-Item "Plain Craft Launcher 2/Resources/*.dll" $out -Force
          Copy-Item "Plain Craft Launcher 2/Resources/*.jar" $out -Force
          Copy-Item "PCLCS/Launch/*.jar" $out -Force
          Write-Output "runtime files copied"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-2.99.0.0
          path: "Plain Craft Launcher 2/bin/"
          if-no-files-found: error